# CI for this fork only: builds and tests the upstream master and the work branches,
# and starts the demo branch in a browser, so changes can be checked without
# installing Node/npm or .NET locally.
# Runs on every push to the `ci` branch; re-run it from the Actions tab or with
# `gh run rerun <id>`.
name: Fork CI (build and test branches)

on:
  push:
    branches: [ci]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref:
          - master
          - fix/unit-test-setup
          - fix/datetime-seconds
          - fix/json-viewer-null
          - fix/restrict-proxy-urls
          - fix/mask-api-key-input
          - fix/api-key-session-storage
          - security/npm-install-policy
          - feature/export-all-pages-csv
          - feature/result-table
          - feature/filter-usability
          - feature/friendly-errors
          - feature/i18n
          - feature/simple-search
          - feature/smart-lists
          - feature/picker-dialog
          - demo
    defaults:
      run:
        working-directory: ddapiv3ui.client
    steps:
      - name: Check out ${{ matrix.ref }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Install dependencies (from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Apply the unit test fix when the branch does not contain it (CI only)
        run: |
          git fetch --quiet origin fix/unit-test-setup
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Branch already contains fix/unit-test-setup."
          else
            git -c user.name=ci -c user.email=ci@example.invalid merge --no-edit --quiet FETCH_HEAD
            echo "Merged fix/unit-test-setup for this test run only."
          fi
          cat > karma.ci.conf.js <<'EOF'
          const base = require('./karma.conf.js');
          module.exports = function (config) {
            base(config);
            config.set({
              browsers: ['ChromeHeadlessCI'],
              customLaunchers: {
                ChromeHeadlessCI: { base: 'ChromeHeadless', flags: ['--no-sandbox'] }
              },
              reporters: ['progress'],
              singleRun: true,
              autoWatch: false,
              restartOnFileChange: false
            });
          };
          EOF

      - name: Unit tests (Karma, headless Chrome)
        run: npx ng test --watch=false --karma-config=karma.ci.conf.js

  demo-smoke:
    name: demo in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out demo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: demo
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and start the demo server
        run: |
          mkdir -p smoke-output
          nohup bash demo/run.sh > smoke-output/server.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1; then
              echo "Server is up after ${i}x5 s"; exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "demo/run.sh stopped before the server was up"; tail -50 smoke-output/server.log; exit 1
            fi
            sleep 5
          done
          echo "Server did not start"; tail -50 smoke-output/server.log; exit 1

      - name: Check the server API
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<app-root" && echo "index.html OK"
          curl -fsS http://localhost:8080/ddapi/appsettings | tee smoke-output/appsettings.json
          echo
          curl -fsS -X POST http://localhost:8080/ddapi/metadata -H 'Content-Type: application/json' \
            -d '{"url":"https://ddapi.aquadesk.nl/v3/odata","endPoint":"Observation"}' > smoke-output/metadata.json
          grep -q "PhenomenonTime/BeginPosition" smoke-output/metadata.json && echo "metadata OK"

          # The server must forward requests to the configured base URL...
          curl -fsS -X POST http://localhost:8080/ddapi -H 'Content-Type: application/json' \
            -d '{"url":"https://ddapi.aquadesk.nl/v3/odata/references?$top=1"}' | grep -q '"value"' && echo "allowed URL OK"
          # ...and refuse everything else (no open proxy).
          for url in "https://example.org/" \
                     "https://ddapi.aquadesk.nl.example.org/v3/odata/references" \
                     "https://ddapi.aquadesk.nl/v3/other" \
                     "https://ddapi.aquadesk.nl/v3/odata/../../admin" \
                     "http://ddapi.aquadesk.nl/v3/odata/references"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/ddapi \
              -H 'Content-Type: application/json' -d "{\"url\":\"$url\"}")
            if [ "$code" != "400" ]; then echo "NOT BLOCKED ($code): $url"; exit 1; fi
            echo "blocked OK: $url"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/ddapi/metadata \
            -H 'Content-Type: application/json' -d '{"url":"https://example.org","endPoint":"Observation"}')
          if [ "$code" != "400" ]; then echo "metadata NOT BLOCKED ($code)"; exit 1; fi
          echo "blocked OK: metadata for https://example.org"

      - name: Browser smoke test (Playwright, Chromium)
        run: |
          mkdir -p /tmp/pw && cp demo/smoke.mjs /tmp/pw/
          cd /tmp/pw
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 OUT_DIR="$GITHUB_WORKSPACE/smoke-output" node smoke.mjs

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: demo-smoke
          path: smoke-output
          retention-days: 14
